name: CI
on:
  push:
    branches: [main, feat/playable-rois-et-des, feat/royal-fleet-blender]
  pull_request:
    branches: [main, feat/playable-rois-et-des]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  rules-and-syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run check
      - run: npm run build
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: python -m venv .venv
      - run: .venv/bin/pip install playwright==1.57.0
      - run: .venv/bin/python -m playwright install --with-deps chromium
      - run: .venv/bin/python tests/echgammon.browser.py
      - run: .venv/bin/python tests/lobby.browser.py
      - run: .venv/bin/python tests/analysis.browser.py
      - run: .venv/bin/python tests/fleet.browser.py
      - run: .venv/bin/python tests/match-layout.browser.py
      - run: .venv/bin/python tests/dice.browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-previews
          path: |
            desktop-preview.png
            mobile-preview.png
            lobby-desktop.png
            lobby-mobile.png
            academy-mobile.png
            analysis-desktop.png
            analysis-mobile.png
            fleet-desktop-preview.png
            fleet-mobile-preview.png
            dice-throw-preview.png
            dice-result-preview.png
            dice-fleet-throw-preview.png
