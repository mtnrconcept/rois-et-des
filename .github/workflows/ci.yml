name: CI
on:
  push:
    branches: [main, feat/playable-rois-et-des]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  rules-and-syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run check
      - run: npm run build
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python -m venv .venv
      - run: .venv/bin/pip install playwright==1.57.0
      - run: .venv/bin/python -m playwright install --with-deps chromium
      - run: .venv/bin/python tests/echgammon.browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-previews
          path: |
            desktop-preview.png
            mobile-preview.png
